name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'labs/lab07/frontend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        run: |
          git clone https://github.com/flutter/flutter.git
          export PATH="$PATH:`pwd`/flutter/bin"
          flutter doctor

      - name: Install dependencies
        run: flutter pub get
        working-directory: labs/lab07/frontend

      - name: Build web
        run: flutter build web --base-href "/sum25-go-flutter-course/lab07-mamajonov-khayotbek/"
        working-directory: labs/lab07/frontend

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./labs/lab07/frontend/build/web
          destination_dir: lab07-mamajonov-khayotbek 